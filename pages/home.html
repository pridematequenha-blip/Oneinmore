<main class="home-page">
  <header class="home-header">

  <section class="update-banner">

      <h2>Aqui vai ter atualizações</h2>

    </div>
    <div class="banner-art" aria-hidden="true">📖<span>🌿</span>☕</div>
  </section>

  <section class="home-section">
    <h2>Favoritos</h2>
    <div class="favorites-row">
      <button class="favorite-card">♡</button>

      <button class="favorite-card">♡</button>
    </div>

  <section class="home-section books-languages">

      <h2>Livros</h2>
      <div class="book-row">
        <button class="book-card book-action" data-title="O poder da ação">
          <span class="book-title">O poder<br>da ação</span><small>PAULO VIEIRA</small><b>◎</b>
        </button>
        <button class="book-card book-rich">
          <span>PAI RICO<br>PAI POBRE</span><small>ROBERT T. KIYOSAKI</small><b>$</b>
        </button>
        <button class="book-card book-blue">
          <span>O homem<br>mais rico da<br>BABILÓNIA</span><small>GEORGE S. CLASON</small><b>🏛</b>
        </button>
      </div>
    </div>

    <div>

      <div class="language-row">
        <button class="language-card" data-language="Inglês"><span>🇺🇸</span><small>Inglês</small></button>

  <section class="home-section">

    <button class="new-book-card" id="newBookHome">
      <div class="new-cover">HÁBITOS<br>ATÓMICOS</div>
      <div class="new-info">
        <h3>Hábitos Atómicos</h3>
        <p>James Clear</p>
        <span>Pequenas mudanças, resultados<br>extraordinários.</span>
      </div>
      <b class="new-badge">Novo</b>

  </section>

  <section class="online-status">

    <div class="status-dots"><i></i><i></i><i></i></div>
