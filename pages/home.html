<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início - Library</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<main class="home-page">
  <header class="home-header">
    <h1>Início</h1>
    <div class="header-actions">
      <button class="icon-btn" id="refreshHome" title="Atualizar">⟳</button>
      <button class="icon-btn" id="themeToggle" title="Tema">☼</button>
    </div>
  </header>

  <section class="update-banner">
    <div class="banner-text">
      <h2>Aqui vai ter atualizações</h2>
      <p>Novidades, livros e muito mais<br>em um só lugar.</p>
    </div>
    <!-- Substituímos os emojis por um carrossel de imagens aleatórias -->
    <div class="banner-art">
      <div class="carousel" id="bannerCarousel" tabindex="0" role="region" aria-label="Carrossel de imagens do banner">
        <button class="carousel-btn prev" id="carouselPrev" aria-label="Anterior">‹</button>
        <div class="carousel-track" id="carouselTrack">
          <!-- imagens aleatórias via picsum.photos (seed para estabilidade entre reloads) -->
          <img src="https://picsum.photos/seed/1/600/360" alt="Imagem 1" />
          <img src="https://picsum.photos/seed/2/600/360" alt="Imagem 2" />
          <img src="https://picsum.photos/seed/3/600/360" alt="Imagem 3" />
          <img src="https://picsum.photos/seed/4/600/360" alt="Imagem 4" />
          <img src="https://picsum.photos/seed/5/600/360" alt="Imagem 5" />
        </div>
        <button class="carousel-btn next" id="carouselNext" aria-label="Próximo">›</button>
      </div>
    </div>
  </section>

  <section class="home-section">
    <h2>Favoritos</h2>
    <div class="favorites-row">
      <button class="favorite-card">♡</button>
      <button class="favorite-card">♡</button>
      <button class="favorite-card">♡</button>
    </div>
  </section>

  <section class="home-section books-languages">
    <div>
      <h2>Livros</h2>
      <div class="book-row">
        <button class="book-card book-action" data-title="O poder da ação">
          <span class="book-title">O poder<br>da ação</span><small>PAULO VIEIRA</small><b>◎</b>
        </button>
        <button class="book-card book-rich">
          <span>PAI RICO<br>PAI POBRE</span><small>ROBERT T. KIYOSAKI</small><b>$</b>
        </button>
        <button class="book-card book-blue">
          <span>O homem<br>mais rico da<br>BABILÓNIA</span><small>GEORGE S. CLASON</small><b>🏛</b>
        </button>
      </div>
    </div>

    <div>
      <h2>Línguas</h2>
      <div class="language-row">
        <button class="language-card" data-language="Inglês"><span>🇺🇸</span><small>Inglês</small></button>
        <button class="language-card" data-language="Espanhol"><span>🇪🇸</span><small>Espanhol</small></button>
      </div>
    </div>
  </section>

  <section class="home-section">
    <h2>Novidades</h2>
    <button class="new-book-card" id="newBookHome">
      <div class="new-cover">HÁBITOS<br>ATÓMICOS</div>
      <div class="new-info">
        <h3>Hábitos Atómicos</h3>
        <p>James Clear</p>
        <span>Pequenas mudanças, resultados<br>extraordinários.</span>
      </div>
      <b class="new-badge">Novo</b>
    </button>
  </section>

  <section class="online-status">
    <h2>Online</h2>
    <div class="status-dots"><i></i><i></i><i></i></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-link active" data-page="home">⌂<small>Início</small></button>
  <button class="nav-link" data-page="music">♫<small>Música</small></button>
  <button class="nav-link" data-page="library">▢<small>Biblioteca</small></button>
  <button class="nav-link" data-page="learn">△<small>Aprenda</small></button>
  <button class="nav-link" data-page="notes">✎<small>Anotações</small></button>
</nav>

<!-- Modal para adicionar livros / músicas -->
<div id="libraryModal" class="modal" aria-hidden="true">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-header">
      <h2 id="modalTitle">Adicionar item</h2>
      <button id="modalClose" class="modal-close" aria-label="Fechar">✕</button>
    </header>
    <form id="modalForm" class="modal-form">
      <label>
        Tipo
        <select id="modalType" name="type">
          <option value="book">Livro</option>
          <option value="music">Música</option>
        </select>
      </label>

      <label>
        Título
        <input id="modalTitleInput" name="title" type="text" required />
      </label>

      <label id="modalAuthorLabel">
        Autor
        <input id="modalAuthorInput" name="author" type="text" required />
      </label>

      <div class="modal-actions">
        <button type="button" id="modalCancel" class="btn btn-muted">Cancelar</button>
        <button type="submit" id="modalSave" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/home.js"></script>
</body>
</html>
